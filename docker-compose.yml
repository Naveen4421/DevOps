version: '3.8'

services:
  club-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-club-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.club.rule=Host(`devopsclub.local`)"
      - "traefik.http.services.club.loadbalancer.server.port=3000"

