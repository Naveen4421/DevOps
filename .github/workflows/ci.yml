name: CI, Tests & Docker Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-and-build:
    name: Lint, Test, Typecheck & Next.js Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      ADMIN_SECRET_KEY: "ci-test-secret-key-32-chars-min-len"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync DB
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Run Unit Tests
        run: npm test

      - name: ESLint Check
        run: npm run lint

      - name: Type Check & Next.js Production Build
        run: npm run build

  docker-build:
    name: Verify Multi-Stage Dockerfile
    runs-on: ubuntu-latest
    needs: lint-test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexops-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
